<body
    class="bg-background text-on-background font-body-md selection:bg-secondary-fixed selection:text-on-secondary-fixed">
    <main class="min-h-screen flex flex-col md:flex-row overflow-hidden">
        <!-- Image Side (Desktop) -->
        <section class="hidden md:block md:w-7/12 h-screen relative">
            <img alt="Lumina Grand Lobby" class="absolute inset-0 w-full h-full object-cover"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuBTjl5Quf-sf0gZbTCD87OJPpKeYnPU9HMrnTLLPIddDBYA2IP-6FtBdV8_tZCNnte8TzYpOVPSfeZOGfxPONHDp-ztedoY14Asw8TLhy57jSZYMr05EOEuUGTFRTJ8jKBuMB-ybUE0xceLEJw7wYAuyLa_UMVKTyKB3xIgGmPoTx07ZMhdzPqagsUPnXIbLii2ZxujlTLIhMwWri6GLA8NzP9UjQAvhLZ5W6PLLIa-q5RULSCkN9S7nC0kMnwcAcoSohsUpEKjW4w" />
            <div class="absolute inset-0 bg-primary/20 mix-blend-multiply"></div>
            <!-- Floating Brand Element -->
            <div class="absolute top-margin-desktop left-margin-desktop z-10">
                <h1
                    class="font-headline-md text-headline-md text-surface-container-lowest uppercase tracking-[0.3em] font-bold">
                    Lumina Grand
                </h1>
                <p class="font-label-sm text-label-sm text-secondary-fixed mt-2 tracking-widest uppercase">Member
                    Registration</p>
            </div>
            <!-- Cinematic Overlay Text -->
            <div class="absolute bottom-margin-desktop left-margin-desktop max-w-md z-10">
                <span class="font-label-md text-label-md text-secondary-fixed uppercase mb-4 block">The Art of
                    Living</span>
                <h2 class="font-display-lg text-display-lg text-surface-container-lowest leading-tight">
                    Your sanctuary <br /> awaits.
                </h2>
            </div>
        </section>
        <!-- Form Side -->
        <section
            class="w-full md:w-5/12 flex flex-col justify-center items-center px-margin-mobile md:px-16 py-12 relative bg-surface-container-lowest">
            <!-- Mobile Brand Header (Visible only on mobile) -->
            <div class="md:hidden w-full mb-12 text-center">
                <h1 class="font-headline-md text-headline-md text-primary uppercase tracking-[0.2em] font-bold">
                    Lumina Grand
                </h1>
                <div class="h-px w-12 bg-secondary mx-auto mt-4"></div>
            </div>
            <div class="w-full max-w-md">
                <header class="mb-stack-md">
                    <h2 class="font-headline-lg text-headline-lg text-primary mb-2">Create Account</h2>
                    <p class="font-body-md text-body-md text-on-surface-variant opacity-80">Join our exclusive circle of
                        luxury and bespoke hospitality.</p>
                </header>
                <form action="#" class="space-y-stack-sm" id="registrationForm" method="POST">
                    <!-- Username -->
                    <div class="group">
                        <label
                            class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-2 block tracking-wider"
                            for="username">Username</label>
                        <div class="relative">
                            <input
                                class="w-full bg-transparent border-0 border-b border-outline-variant py-3 focus:ring-0 focus:border-secondary font-body-md text-body-md text-primary placeholder:text-outline-variant/50 form-focus-transition"
                                id="username" name="username" placeholder="E.g. Alexander_Grande" required=""
                                type="text" />
                            <span
                                class="material-symbols-outlined absolute right-0 top-3 text-outline-variant group-focus-within:text-secondary text-[20px]">person</span>
                        </div>
                    </div>
                    <!-- Email -->
                    <div class="group">
                        <label
                            class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-2 block tracking-wider"
                            for="email">Email Address</label>
                        <div class="relative">
                            <input
                                class="w-full bg-transparent border-0 border-b border-outline-variant py-3 focus:ring-0 focus:border-secondary font-body-md text-body-md text-primary placeholder:text-outline-variant/50 form-focus-transition"
                                id="email" name="email" placeholder="name@residence.com" required="" type="email" />
                            <span
                                class="material-symbols-outlined absolute right-0 top-3 text-outline-variant group-focus-within:text-secondary text-[20px]">mail</span>
                        </div>
                    </div>
                    <!-- Password Grid -->
                    <div class="grid grid-cols-1 gap-stack-sm">
                        <!-- Password -->
                        <div class="group">
                            <label
                                class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-2 block tracking-wider"
                                for="password">Password</label>
                            <div class="relative">
                                <input
                                    class="w-full bg-transparent border-0 border-b border-outline-variant py-3 focus:ring-0 focus:border-secondary font-body-md text-body-md text-primary placeholder:text-outline-variant/50 form-focus-transition"
                                    id="password" name="password" placeholder="••••••••" required="" type="password" />
                                <span
                                    class="material-symbols-outlined absolute right-0 top-3 text-outline-variant group-focus-within:text-secondary text-[20px]">lock</span>
                            </div>
                        </div>
                        <!-- Confirm Password -->
                        <div class="group">
                            <label
                                class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-2 block tracking-wider"
                                for="confirm-password">Confirm Password</label>
                            <div class="relative">
                                <input
                                    class="w-full bg-transparent border-0 border-b border-outline-variant py-3 focus:ring-0 focus:border-secondary font-body-md text-body-md text-primary placeholder:text-outline-variant/50 form-focus-transition"
                                    id="confirm-password" name="confirm-password" placeholder="••••••••" required=""
                                    type="password" />
                                <span
                                    class="material-symbols-outlined absolute right-0 top-3 text-outline-variant group-focus-within:text-secondary text-[20px]">verified_user</span>
                            </div>
                        </div>
                    </div>
                    <!-- Terms & Newsletter -->
                    <div class="flex items-start gap-3 pt-2">
                        <input
                            class="mt-1 rounded-none border-outline-variant text-secondary focus:ring-secondary/50 h-4 w-4"
                            id="terms" type="checkbox" />
                        <label class="font-label-sm text-label-sm text-on-surface-variant leading-relaxed" for="terms">
                            I agree to the <a class="text-secondary hover:underline underline-offset-4" href="#">Terms
                                of Service</a> and <a class="text-secondary hover:underline underline-offset-4"
                                href="#">Privacy Policy</a>.
                        </label>
                    </div>
                    <!-- Register Button -->
                    <div class="pt-stack-sm">
                        <button
                            class="w-full py-5 bg-secondary text-on-secondary-fixed font-label-md text-label-md uppercase tracking-[0.2em] shadow-sm hover:bg-[#8a7000] hover:-translate-y-0.5 active:scale-[0.98] transition-all duration-300"
                            type="submit">
                            Register
                        </button>
                    </div>
                </form>
                <footer class="mt-12 text-center border-t border-outline-variant pt-8">
                    <p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account?
                        <a class="text-primary font-bold hover:text-secondary transition-colors duration-300 ml-2"
                            href="Login.html">Login</a>
                    </p>
                </footer>
            </div>
            <!-- Footer Small Text -->
            <div class="absolute bottom-8 text-center px-4 w-full md:w-auto">
                <p class="font-label-sm text-[10px] text-outline-variant uppercase tracking-widest">
                    © 2024 Lumina Grand Luxury Resorts. All Rights Reserved.
                </p>
            </div>
        </section>
    </main>
    <!-- Micro-interaction script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            const form = document.getElementById('registrationForm');

            // Simple input ripple effect simulation
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.querySelector('.material-symbols-outlined').style.transform = 'scale(1.1)';
                    input.parentElement.querySelector('.material-symbols-outlined').style.transition = 'transform 0.3s ease';
                });
                input.addEventListener('blur', () => {
                    input.parentElement.querySelector('.material-symbols-outlined').style.transform = 'scale(1)';
                });
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const originalText = btn.innerText;

                // Visual feedback for click
                btn.innerText = 'Creating Account...';
                btn.classList.add('opacity-80');

                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('opacity-80');
                    alert('Experience the Grandeur. Your registration is being processed.');
                }, 1500);
            });
        });
    </script>
</body>

</html>
